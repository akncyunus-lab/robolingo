<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#73c8f2">
  <title>RoboLingo - Your English Buddy!</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand">
        <div class="brand-icon">🤖</div>
        <div class="brand-text">
          <h1>Robo<span>Lingo</span></h1>
          <p>Your English Buddy!</p>
        </div>
      </div>
      <div class="stats">
        <div class="stat"><span>⭐</span><b id="stars">12</b></div>
        <div class="stat"><span>🔥</span><b id="streak">5</b></div>
      </div>
    </header>

    <section class="hero">
      <div class="robo-area">
        <img class="robo-image" src="assets/robo-transparent.png"
             alt="Robo - RoboLingo English Buddy"
             onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
        <div class="robo-fallback">🤖</div>
      </div>

      <div class="speech">
        <h2>Hi! I'm Robo! <span>👋</span></h2>
        <p>Let's learn English<br>together!</p>
        <button id="startBtn" class="primary-btn">Let's Learn 🚀</button>
      </div>
    </section>

    <section class="quick-grid">
      <button class="feature learn" data-section="Dersler">
        <span class="icon">📖</span>
        <strong>Learn <i>›</i></strong>
        <small>Derslerle öğren</small>
      </button>

      <button class="feature speak" data-section="Konuş">
        <span class="icon">💬</span>
        <strong>Speak <i>›</i></strong>
        <small>Konuşma pratiği yap</small>
      </button>

      <button class="feature play" data-section="Oyunlar">
        <span class="icon">🎮</span>
        <strong>Play <i>›</i></strong>
        <small>Oyunlarla pekiştir</small>
      </button>

      <button class="feature progress" data-section="Başarılar">
        <span class="icon">⭐</span>
        <strong>My Progress <i>›</i></strong>
        <small>İlerlemeni gör</small>
      </button>
    </section>

    <section class="lessons">
      <div class="section-title">
        <h2>Popüler Dersler</h2>
        <button id="allLessons">Tüm Dersleri Gör ›</button>
      </div>

      <div class="lesson-row">
        <button class="lesson" data-lesson="Hello!">
          <span>👋</span><b>Hello!</b><small>0 / 7 ⭐</small>
        </button>
        <button class="lesson" data-lesson="Numbers">
          <span>🔢</span><b>Numbers</b><small>0 / 10 ⭐</small>
        </button>
        <button class="lesson" data-lesson="Animals">
          <span>🐱</span><b>Animals</b><small>0 / 10 ⭐</small>
        </button>
        <button class="lesson" data-lesson="Colors">
          <span>🎨</span><b>Colors</b><small>0 / 8 ⭐</small>
        </button>
        <button class="lesson" data-lesson="Food">
          <span>🍎</span><b>Food</b><small>0 / 8 ⭐</small>
        </button>
      </div>
    </section>

    <section class="motivation">
      <div class="rocket">🚀</div>
      <div>
        <b>Her gün biraz daha İngilizce!</b>
        <span>Small steps, big future!</span>
      </div>
      <button id="challengeBtn">Sen Yapabilirsin! ›</button>
    </section>

    <nav class="bottom-nav">
      <button class="active" data-section="Ana Sayfa"><span>⌂</span><small>Ana Sayfa</small></button>
      <button data-section="Dersler"><span>▤</span><small>Dersler</small></button>
      <button data-section="Konuş"><span>●</span><small>Konuş</small></button>
      <button data-section="Oyunlar"><span>🎮</span><small>Oyunlar</small></button>
      <button data-section="Başarılar"><span>🏆</span><small>Başarılar</small></button>
      <button data-section="Ayarlar"><span>⚙</span><small>Ayarlar</small></button>
    </nav>
  </main>

  <div class="toast" id="toast"></div>
  <script src="app.js"></script>
</body>
</html>
